currency_finding: >-
  There is no first-party SDK whose release date can be compared against the API, so the usual abandonment
  signal is unavailable here. The nearest proxy is that every OwnLocal module that IS published to a registry
  last shipped between 2014 and 2016, and the newest public push in the organization is from 2023 — against
  a live v1 API whose documentation examples are dated 2019-2021.
