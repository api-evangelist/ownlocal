apis:
- name: OwnLocal API
  description: >-
    Partner-facing REST API (v1) for OwnLocal's automated print-to-digital advertising platform. Publishers
    and their systems create and list ads, upload the source print-ad PDF for conversion, create and update
    the local business (advertiser) records those ads belong to, attach logos and imagery, read the OwnLocal
    category vocabulary, and pull performance reports covering impressions, interaction breakdowns, leads,
    digital lift and search-rank history. Authenticated with an organization API key sent raw in the
    Authorization header; keys are issued by OwnLocal support, not self-serve.
  humanURL: https://api.docs.ownlocal.com/
  baseURL: https://admin.austin.ownlocal.com
