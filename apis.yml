aid: ownlocal
name: OwnLocal
description: OwnLocal is an Austin, Texas based automated digital advertising platform for local media
  companies, founded in 2010 by Lloyd Armbrust and Jason Novek. It helps newspapers, local publishers and
  media companies power their digital services by automatically converting traditional print advertisements
  into online marketing campaigns — its AdForge and Origami products turn a submitted print ad PDF into a
  responsive digital ad unit, a business directory listing and an SEO/search presence, extending advertiser
  reach across search, social and display channels. OwnLocal publishes a partner-facing REST API (the
  OwnLocal API, v1) documented with Slate at api.docs.ownlocal.com and backed by a live Swagger 2.0
  definition served from its own Swagger UI, covering ads, businesses, categories and performance reporting.
  API keys are issued by OwnLocal support rather than self-serve. OwnLocal was a 500 Global portfolio
  company and has acquired Whoosh Traffic, Sidengo, Inbound Press and Wanderful Media.
