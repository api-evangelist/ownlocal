aid: ownlocal
name: OwnLocal
description: OwnLocal is an Austin-based automated digital advertising platform for local media companies.
  It helps newspapers, local publishers, and media companies power their digital services by automatically
  converting traditional print advertisements into online marketing campaigns, extending advertiser reach
  across search, social, and display channels. OwnLocal was a 500 Global portfolio company; its current
  public surface is a marketing site with no published developer or API program.
