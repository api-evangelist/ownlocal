gaps_for_agent_use:
- gap: No publisher discovery
  detail: >-
    Every write and every report requires a publisherUuid, and no operation lists the publishers a key can
    see. An agent cannot bootstrap — the tenancy id must be supplied out of band.
  severity: high
- gap: No idempotency
  detail: create_ad / create_business cannot be safely retried, and no DELETE exists to clean up duplicates.
  severity: high
  see: conventions/ownlocal-conventions.yml
- gap: No async completion signal
  detail: Three tools return 202 with no callback; polling is the only completion strategy.
  severity: medium
- gap: No rate-limit signal
  detail: 429 is enforced but unquantified and header-less, so an agent cannot pace itself.
  severity: medium
  see: rate-limits/ownlocal-rate-limits.yml
- gap: Unschema'd errors
  detail: Only 3 of 13 operations declare a typed error body; 401/403/429 appear on no operation.
  severity: medium
  see: errors/ownlocal-problem-types.yml
