    contract never names the server it describes. The host is taken verbatim from the published API reference
    at https://api.docs.ownlocal.com/, where every curl example calls https://admin.austin.ownlocal.com/api/v1/...
  update:
    servers:
    - url: https://admin.austin.ownlocal.com
      description: OwnLocal production API host (per the published API reference)
- target: $
  description: Link the machine contract back to the human reference it was cross-read against.
  update:
    externalDocs:
      description: OwnLocal API Docs
      url: https://api.docs.ownlocal.com/
- target: $.info
  description: Add contact (support@ownlocal.com / the support page, both published by OwnLocal) and a tag-scoped
    description. The source info block carries only title and version.
  update:
    description: Performance reporting for ads and businesses — impressions, interaction breakdowns, leads, digital
      lift and search-rank history.
    contact:
      name: OwnLocal Support
      email: support@ownlocal.com
      url: https://www.ownlocal.com/support/
- target: $
  description: Declare the tag. The source Swagger uses tags on operations but never declares them at the root,
    so no tag carries a description.
  update:
    tags:
    - name: Reports Data API
      description: Performance reporting for ads and businesses — impressions, interaction breakdowns, leads,
        digital lift and search-rank history.
- target: $.paths['/api/v1/reports/ads'].get
  description: Add operationId 'getAdsReport'. None of OwnLocal's 13 operations declares an operationId, which
    blocks code generation and leaves agent tooling with no stable handle. Assigned deterministically from the
    HTTP method and resource path.
  update:
    operationId: getAdsReport
- target: $.paths['/api/v1/reports/business'].get
  description: Add operationId 'getBusinessReport'. None of OwnLocal's 13 operations declares an operationId,
    which blocks code generation and leaves agent tooling with no stable handle. Assigned deterministically from
